<!DOCTYPE html>
<html lang="es">    
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap 5 - Primeros pasos</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <header class="bg-light p-3 mb-4">
            <h1 class="text-center text-primary">Ejercicio 4: Grilla responsive</h1>
        </header>
        <main class="container exercise-4 my-5">
            <div class="row g-3">
                <div class="col-12">
                    <div class="container-pink-200 exercise-4-header d-flex d-sm-none align-items-center justify-content-center p-3">
                        <h2 class="fs-4 m-0">Header</h2>
                    </div>
                    <div class="container-cyan-400 exercise-4-header d-none d-sm-flex d-md-none align-items-center justify-content-start p-3">
                        <h2 class="fs-2 m-0">Header</h2>
                    </div>
                    <div class="container-green-600 exercise-4-header d-none d-md-flex align-items-center justify-content-start p-3">
                        <h2 class="fs-2 m-0">Header</h2>
                    </div>
                </div>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-12 col-sm-6 col-md-4">
                    <div class="container-red-300 exercise-4-number d-flex align-items-center justify-content-start justify-content-md-center p-3">
                        <h2 class="fs-1 m-0">1</h2>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-md-4">
                    <div class="container-cyan-400 exercise-4-number d-flex d-sm-none align-items-center justify-content-center p-3">
                        <h2 class="fs-1 m-0">2</h2>
                    </div>
                    <div class="container-red-300 exercise-4-number d-none d-sm-flex align-items-center justify-content-end justify-content-md-center p-3">
                        <h2 class="fs-1 m-0">2</h2>
                    </div>
                </div>
                <div class="col-12 col-sm-12 col-md-4">
                    <div class="container-red-300 exercise-4-number d-flex d-sm-none align-items-center justify-content-end p-3">
                        <h2 class="fs-1 m-0">3</h2>
                    </div>
                    <div class="container-green-200 exercise-4-number d-none d-sm-flex d-md-none align-items-center justify-content-center p-3">
                        <h2 class="fs-1 m-0">3</h2>
                    </div>
                    <div class="container-red-300 exercise-4-number d-none d-md-flex align-items-center justify-content-center p-3">
                        <h2 class="fs-1 m-0">3</h2>
                    </div>
                </div>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-12 col-md-6">
                    <div class="container-yellow-400 exercise-4-footer d-flex align-items-center justify-content-center justify-content-md-end p-3">
                        <p class="fs-5 m-0">Footer 1</p>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="container-yellow-400 exercise-4-footer d-flex align-items-center justify-content-center justify-content-md-start p-3">
                        <p class="fs-5 m-0">Footer 2</p>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
