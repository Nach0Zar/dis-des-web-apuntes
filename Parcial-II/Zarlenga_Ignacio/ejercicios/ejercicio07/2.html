<!DOCTYPE html>
<html lang="es">    
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap 5 - Primeros pasos</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <header class="bg-light p-3 mb-4">
            <h1 class="text-center text-primary">Ejercicio 2: Grillas en Bootstrap 5</h1>
        </header>
        <main class="container text-center">
            <div class="row g-3">
                <div class="col-12">
                    <div class="container-green-200 p-3">
                        <h2>header</h2>
                    </div>
                </div>
                <div class="d-sm-none col-12">
                    <div class="container-red-300 p-3">
                        <h2>banner mobile</h2>
                    </div>
                </div>
                <div class="col-12">
                    <div class="container-cyan-400 p-3">
                        <h2>banner interno</h2>
                    </div>
                </div>
                <div class="col-md-6 col-sm-12">
                    <div class="container-gray-400 p-3">
                        <h2>columna izquierda</h2>
                    </div>
                </div>
                <div class="col-md-6 col-sm-12">
                    <div class="container-gray-400 p-3">
                        <h2>columna derecha</h2>
                    </div>
                </div>
                <div class="row row-cols-2 row-cols-sm-4 row-cols-md-5 g-2">
                    <div class="col">
                        <div class="container-blue-300 ratio ratio-1x1 p-3">
                            <h2>col 1</h2>
                        </div>
                    </div>
                    <div class="col">
                        <div class="container-blue-300 ratio ratio-1x1 p-3">
                            <h2>col 2</h2>
                        </div>
                    </div>
                    <div class="col">
                        <div class="container-blue-300 ratio ratio-1x1 p-3">
                            <h2>col 3</h2>
                        </div>
                    </div>
                    <div class="col">
                        <div class="container-blue-300 ratio ratio-1x1 p-3">
                            <h2>col 4</h2>
                        </div>
                    </div>
                    <div class="col">
                        <div class="container-blue-300 ratio ratio-1x1 p-3">
                            <h2>col 5</h2>
                        </div>
                    </div>
                    <div class="col">
                        <div class="container-blue-300 ratio ratio-1x1 p-3">
                            <h2>col 6</h2>
                        </div>
                    </div>
                    <div class="col">
                        <div class="container-blue-300 ratio ratio-1x1 p-3">
                            <h2>col 7</h2>
                        </div>
                    </div>
                    <div class="col">
                        <div class="container-blue-300 ratio ratio-1x1 p-3">
                            <h2>col 8</h2>
                        </div>
                    </div>
                    <div class="col">
                        <div class="container-blue-300 ratio ratio-1x1 p-3">
                            <h2>col 9</h2>
                        </div>
                    </div>
                    <div class="col">
                        <div class="container-blue-300 ratio ratio-1x1 p-3">
                            <h2>col 10</h2>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="container-green-200 p-3">
                        <h2>footer</h2>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
